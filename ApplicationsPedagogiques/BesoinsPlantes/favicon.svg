<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Favicon SVT — feuille et ADN</title>
  <desc id="desc">Emblème circulaire associant une feuille, une double hélice d’ADN et les couleurs de la nature et des sciences.</desc>
  <defs>
    <linearGradient id="ring" x1="90" y1="78" x2="424" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7a33b"/>
      <stop offset="0.23" stop-color="#f3d47d"/>
      <stop offset="0.52" stop-color="#ad7622"/>
      <stop offset="0.78" stop-color="#f0cb68"/>
      <stop offset="1" stop-color="#885515"/>
    </linearGradient>
    <linearGradient id="leaf" x1="170" y1="135" x2="340" y2="377" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f9b6f"/>
      <stop offset="1" stop-color="#0e5646"/>
    </linearGradient>
    <linearGradient id="dna" x1="208" y1="142" x2="302" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4d77e"/>
      <stop offset="0.52" stop-color="#c28b2f"/>
      <stop offset="1" stop-color="#f0ca67"/>
    </linearGradient>
  </defs>

  <!-- Couronne scientifique -->
  <circle cx="256" cy="256" r="211" fill="#0c2637" stroke="url(#ring)" stroke-width="19"/>
  <circle cx="256" cy="256" r="184" fill="#102f3d" stroke="#2b705d" stroke-width="7"/>

  <!-- Feuille centrale -->
  <path d="M256 390C181 348 150 281 168 214c16-60 66-91 148-103 18-3 35-8 50-17 1 80-13 147-48 199-18 27-39 48-62 64z"
        fill="url(#leaf)" stroke="#73bb8d" stroke-width="6" stroke-linejoin="round"/>
  <path d="M256 385c-1-84 17-151 55-202 17-23 35-42 55-57"
        fill="none" stroke="#d9b24c" stroke-width="9" stroke-linecap="round"/>

  <!-- Double hélice intégrée à la nervure -->
  <path d="M220 150c65 38 65 79 0 118s-65 80 1 124"
        fill="none" stroke="url(#dna)" stroke-width="13" stroke-linecap="round"/>
  <path d="M292 150c-65 38-65 79 0 118s65 80-1 124"
        fill="none" stroke="#8bc7cf" stroke-width="13" stroke-linecap="round"/>
  <g fill="none" stroke="#eef4df" stroke-width="7" stroke-linecap="round">
    <path d="M234 171h44"/>
    <path d="M218 215h76"/>
    <path d="M233 258h46"/>
    <path d="M218 302h76"/>
    <path d="M234 346h44"/>
  </g>

  <!-- Petits repères moléculaires -->
  <g fill="#e6c45f">
    <circle cx="125" cy="181" r="8"/>
    <circle cx="389" cy="326" r="8"/>
    <circle cx="373" cy="164" r="5"/>
    <circle cx="139" cy="339" r="5"/>
  </g>
</svg>
